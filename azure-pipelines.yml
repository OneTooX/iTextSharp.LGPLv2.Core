# The package version comes from the branch, as it does in the other OneTooX repos - this
# follows Module.Shared. Build.SourceBranchName is the last segment of the ref, so
# refs/heads/release/26.3 arrives here as "26.3", and the two-part test is what tells a release
# branch from anything else. A release branch publishes 26.3.<build>, a feature branch publishes
# a prerelease of the release it is aimed at, and master builds without publishing.
#
# This replaces the hand-kept major/minor pair that produced 1.0.x up to 1.0.24. The new numbers
# are higher, so consumers can still move forward, and the version now says which release line
# the package belongs to.
variables:
  ${{ if eq(length(split(variables['Build.SourceBranchName'], '.')), 2) }}:
    otxVersion: ${{ variables['Build.SourceBranchName'] }}
    publish: true
    suffix: ''
  ${{ elseif contains(variables['Build.SourceBranch'], 'feature') }}:
    otxVersion: $[ format('{0:yy}.3', pipeline.startTime) ]
    publish: true
    suffix: -prerelease-${{ replace(variables['Build.SourceBranchName'], '_', '-') }}
  ${{ else }}:
    otxVersion: $[ format('{0:yy}.0', pipeline.startTime) ]
    publish: false
    suffix: ''
name: $(otxVersion).$(Rev:r)$(suffix)

# Development happens on release/* branches, as it does across the OneTooX repos; master
# is behind. Only master was listed here, so every release branch build so far has been
# queued by hand. The definition takes its CI trigger from this file
# (settingsSourceType 2, empty branch filter), so this is the only place to set it.
trigger:
  branches:
    include:
      - master
      - release/*
      - feature/*

pool:
  vmImage: 'windows-latest'

steps:
# The project targets net10.0 and global.json pins the SDK exactly, matching upstream.
# Hosted images lag SDK releases by weeks, so install the pinned version rather than
# relaxing global.json - that keeps the source identical to VahidN/iTextSharp.LGPLv2.Core
# and leaves the merge surface at zero.
- task: UseDotNet@2
  displayName: Install the SDK global.json asks for
  inputs:
    packageType: 'sdk'
    useGlobalJson: true
- task: DotNetCoreCLI@2
  displayName: Build
  inputs:
    command: 'build'
    arguments: '--configuration Release'
- task: DotNetCoreCLI@2
  displayName: Test
  inputs:
    command: 'test'
    arguments: '--filter "TestCategory!=Not working&TestCategory!=Manual Only" --collect "Code Coverage"'
- task: DotNetCoreCLI@2
  displayName: Pack
  inputs:
    command: 'pack'
    includesymbols: true
    includesource: true
    outputDir: '$(Build.ArtifactStagingDirectory)'
    # 'off' rather than byBuildNumber, which will not accept the prerelease suffix a feature
    # branch build carries. The build number is passed through as a property instead.
    versioningScheme: 'off'
    buildProperties: 'Version=$(Build.BuildNumber);PackageVersion=$(Build.BuildNumber)'
- task: NuGetCommand@2
  displayName: 'NuGet push'
  condition: and(succeeded(), eq(variables['publish'], 'true'))
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
    nuGetFeedType: 'internal'
    publishVstsFeed: '62adf057-2d2d-45b0-b31b-74d4937bec2a/550162c4-88e9-4747-a6b9-396b939f9346'
- task: PublishSymbols@2
  condition: and(succeeded(), eq(variables['publish'], 'true'))
  inputs:
    SearchPattern: '**/bin/**/*.pdb'
    SymbolServerType: 'TeamServices'
